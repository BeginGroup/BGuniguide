<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0F6E56">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>UniGuide — Ассистент выставки</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/tabler-icons.min.css" crossorigin="anonymous">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green-50: #E1F5EE; --green-100: #9FE1CB; --green-400: #1D9E75;
    --green-600: #0F6E56;
    --bg: #FFFFFF; --bg2: #F5F5F3; --bg3: #EDEDE9;
    --text: #1A1A18; --text2: #6B6B67; --text3: #9E9E99;
    --border: rgba(0,0,0,0.10); --border2: rgba(0,0,0,0.18);
    --radius: 12px; --radius-sm: 8px; --radius-pill: 99px;
    --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151513; --bg2: #1E1E1B; --bg3: #252522;
      --text: #F0F0EC; --text2: #9E9E9A; --text3: #6B6B68;
      --border: rgba(255,255,255,0.09); --border2: rgba(255,255,255,0.15);
      --green-50: #0A2A1E; --green-100: #0D3D2A;
      --green-400: #1D9E75; --green-600: #25C490;
    }
  }
  html, body { height: 100%; width: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  .app { display: flex; flex-direction: column; height: 100dvh; max-width: 600px; margin: 0 auto; }
  .header { flex-shrink: 0; padding: 14px 16px 12px; border-bottom: 0.5px solid var(--border); background: var(--bg); }
  .header-row { display: flex; align-items: center; gap: 10px; margin-bottom: 3px; }
  .logo { width: 34px; height: 34px; border-radius: var(--radius-sm); background: var(--green-400); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .logo i { font-size: 18px; color: #fff; }
  .header-title { font-size: 16px; font-weight: 600; letter-spacing: -0.3px; color: var(--text); }
  .header-sub { font-size: 11px; color: var(--text3); margin-top: 1px; }
  .expo-bar { flex-shrink: 0; padding: 10px 16px; border-bottom: 0.5px solid var(--border); background: var(--bg2); }
  .expo-meta { font-size: 11px; color: var(--text2); margin-bottom: 6px; }
  .expo-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 5px; }
  .stands-scroll { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 2px; }
  .stands-scroll::-webkit-scrollbar { display: none; }
  .stand-tag { display: flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: var(--radius-pill); border: 0.5px solid var(--green-100); background: var(--green-50); font-size: 12px; font-weight: 500; color: var(--green-600); white-space: nowrap; flex-shrink: 0; }
  .stand-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green-400); }
  .loading-tag { padding: 5px 10px; border-radius: var(--radius-pill); border: 0.5px dashed var(--border2); font-size: 12px; color: var(--text3); white-space: nowrap; flex-shrink: 0; }
  .messages { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 14px 8px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
  .msg { display: flex; gap: 7px; max-width: 92%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.bot { align-self: flex-start; }
  .av { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 13px; margin-top: 2px; }
  .av.bot { background: var(--green-50); color: var(--green-600); }
  .av.user { background: var(--bg3); color: var(--text2); }
  .bubble { padding: 9px 12px; font-size: 14px; line-height: 1.5; border-radius: var(--radius); }
  .msg.user .bubble { background: var(--green-400); color: #fff; border-radius: var(--radius) 4px var(--radius) var(--radius); }
  .msg.bot .bubble { background: var(--bg2); color: var(--text); border-radius: 4px var(--radius) var(--radius) var(--radius); border: 0.5px solid var(--border); }
  .stand-card { margin-top: 9px; padding: 10px 12px; border-radius: var(--radius-sm); border: 0.5px solid var(--green-100); background: var(--green-50); }
  .stand-card-label { font-size: 10px; color: var(--green-400); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .stand-card-name { font-size: 13px; font-weight: 600; color: var(--green-600); }
  .stand-card-meta { font-size: 11px; color: var(--green-400); margin-top: 2px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .chip { padding: 6px 11px; border-radius: var(--radius-pill); border: 0.5px solid var(--border2); background: var(--bg); font-size: 12.5px; color: var(--text2); cursor: pointer; font-family: var(--font); }
  .chip:active { background: var(--bg3); }
  .loading-bubble { padding: 11px 14px; background: var(--bg2); border-radius: 4px var(--radius) var(--radius) var(--radius); border: 0.5px solid var(--border); display: flex; align-items: center; gap: 6px; }
  .loading-bubble span { font-size: 12px; color: var(--text3); }
  .dot-anim span { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--green-400); animation: blink 1.2s infinite; }
  .dot-anim span:nth-child(2) { animation-delay: 0.2s; }
  .dot-anim span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100%{opacity:0.3;transform:scale(0.7)} 40%{opacity:1;transform:scale(1)} }
  .input-area { flex-shrink: 0; padding: 10px 12px calc(10px + var(--safe-bottom)); border-top: 0.5px solid var(--border); background: var(--bg); display: flex; gap: 8px; align-items: flex-end; }
  .input-wrap { flex: 1; }
  textarea { width: 100%; resize: none; border: 0.5px solid var(--border2); border-radius: 20px; padding: 9px 14px; font-size: 15px; font-family: var(--font); background: var(--bg2); color: var(--text); outline: none; min-height: 38px; max-height: 110px; line-height: 1.4; display: block; -webkit-appearance: none; }
  textarea::placeholder { color: var(--text3); }
  textarea:focus { border-color: var(--green-400); }
  .send-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--green-400); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; -webkit-tap-highlight-color: transparent; }
  .send-btn:active { transform: scale(0.93); background: var(--green-600); }
  .send-btn:disabled { opacity: 0.35; }
  .send-btn i { font-size: 17px; color: #fff; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-row">
      <div class="logo"><i class="ti ti-building-community"></i></div>
      <div>
        <div class="header-title">UniGuide</div>
        <div class="header-sub">Ассистент образовательной выставки</div>
      </div>
    </div>
  </div>
  <div class="expo-bar">
    <div class="expo-meta" id="expo-meta">Загрузка данных выставки...</div>
    <div class="expo-label">Участники</div>
    <div class="stands-scroll" id="stands-list">
      <div class="loading-tag">загрузка...</div>
    </div>
  </div>
  <div class="messages" id="messages"></div>
  <div class="input-area">
    <div class="input-wrap">
      <textarea id="input" rows="1" placeholder="Спросите о специальностях, поступлении..." onkeydown="handleKey(event)" oninput="autoResize(this)" disabled></textarea>
    </div>
    <button class="send-btn" id="send-btn" onclick="sendMessage()" aria-label="Отправить" disabled>
      <i class="ti ti-arrow-up"></i>
    </button>
  </div>
</div>

<script>
// ======================================================
const API_KEY = "REPLACE_WITH_YOUR_API_KEY";
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSna_RrRUCMLh8p7mMRK4JBEcjJJ8MvO-aGEJ_lkWZJ_Y9Feo1zEtq986_Qk831bW5gTCIEOqFGQzBR/pub?gid=0&single=true&output=csv";
// ======================================================

let participants = [];
let expoInfo = {};
let conversation = [];
let isBusy = false;

// Parse CSV
function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
  return lines.slice(1).map(line => {
    const values = [];
    let cur = '', inQ = false;
    for (let ch of line) {
      if (ch === '"') inQ = !inQ;
      else if (ch === ',' && !inQ) { values.push(cur.trim()); cur = ''; }
      else cur += ch;
    }
    values.push(cur.trim());
    const obj = {};
    headers.forEach((h, i) => obj[h] = (values[i] || '').replace(/^"|"$/g, ''));
    return obj;
  });
}

async function loadParticipants() {
  try {
    const resp = await fetch(CSV_URL);
    const text = await resp.text();
    const rows = parseCSV(text);

    participants = rows.map(r => ({
      type: r['Type'] || '',
      name: r['Name'] || '',
      country: r['Country'] || '',
      date: r['Date'] || '',
      place: r['Place'] || '',
      time: r['Time'] || '',
      stand: r['Stand'] || ''
    })).filter(p => p.name);

    // Extract expo info from first row
    if (participants.length > 0) {
      expoInfo = {
        date: participants[0].date,
        place: participants[0].place.trim(),
        time: participants[0].time
      };
    }

    renderExpoBar();
    enableChat();
    showWelcome();
  } catch (e) {
    document.getElementById('expo-meta').textContent = 'Не удалось загрузить данные выставки';
    document.getElementById('stands-list').innerHTML = '<div class="loading-tag">ошибка загрузки</div>';
  }
}

function renderExpoBar() {
  document.getElementById('expo-meta').textContent =
    `📅 ${expoInfo.date} · ⏰ ${expoInfo.time} · 📍 ${expoInfo.place}`;

  const list = document.getElementById('stands-list');
  list.innerHTML = '';
  participants.forEach(p => {
    const tag = document.createElement('div');
    tag.className = 'stand-tag';
    tag.innerHTML = `<span class="stand-dot"></span>${p.name}`;
    list.appendChild(tag);
  });
}

function enableChat() {
  document.getElementById('input').disabled = false;
  document.getElementById('send-btn').disabled = false;
}

function showWelcome() {
  const uniCount = participants.filter(p => p.type === 'Universities').length;
  addMessage('bot', `Привет! На выставке сегодня ${participants.length} участников, из них ${uniCount} университетов из разных стран. Помогу найти подходящий вариант — спрашивайте!
    <div class="chips">
      <div class="chip" onclick="quickAsk('Хочу стать программистом — куда поступить?')">💻 IT и программирование</div>
      <div class="chip" onclick="quickAsk('Интересует медицина')">🔬 Медицина</div>
      <div class="chip" onclick="quickAsk('Хочу учиться в Европе')">🇪🇺 Европа</div>
      <div class="chip" onclick="quickAsk('Какие университеты из США?')">🇺🇸 США</div>
      <div class="chip" onclick="quickAsk('Расскажите о стоимости обучения')">💰 Стоимость</div>
      <div class="chip" onclick="quickAsk('Какие агентства по поступлению за рубеж?')">🌍 Агентства</div>
    </div>`);
}

function addMessage(role, html, standInfo) {
  const msgs = document.getElementById('messages');
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;
  const av = document.createElement('div');
  av.className = `av ${role}`;
  av.innerHTML = role === 'bot' ? '🤖' : '👤';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = html;
  if (standInfo) {
    const card = document.createElement('div');
    card.className = 'stand-card';
    card.innerHTML = `
      <div class="stand-card-label">📍 рекомендуемый стенд</div>
      <div class="stand-card-name">${standInfo.name}</div>
      <div class="stand-card-meta">${standInfo.country ? standInfo.country + ' · ' : ''}Стенд ${standInfo.stand}</div>`;
    bubble.appendChild(card);
  }
  wrap.appendChild(av);
  wrap.appendChild(bubble);
  msgs.appendChild(wrap);
  msgs.scrollTop = msgs.scrollHeight;
}

function addLoadingMsg() {
  const msgs = document.getElementById('messages');
  const wrap = document.createElement('div');
  wrap.className = 'msg bot';
  wrap.id = 'loading-msg';
  wrap.innerHTML = `<div class="av bot">🤖</div><div class="loading-bubble"><div class="dot-anim"><span></span><span></span><span></span></div><span>ищу информацию...</span></div>`;
  msgs.appendChild(wrap);
  msgs.scrollTop = msgs.scrollHeight;
}
function removeLoadingMsg() {
  const el = document.getElementById('loading-msg');
  if (el) el.remove();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 110) + 'px';
}
function quickAsk(text) {
  document.getElementById('input').value = text;
  sendMessage();
}

async function sendMessage() {
  if (isBusy || participants.length === 0) return;
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = 'auto';
  addMessage('user', text);
  conversation.push({ role: 'user', content: text });
  isBusy = true;
  document.getElementById('send-btn').disabled = true;
  addLoadingMsg();

  const participantList = participants.map((p, i) =>
    `${i+1}. [${p.type}] ${p.name}${p.country ? ' (' + p.country + ')' : ''} — Стенд ${p.stand}`
  ).join('\n');

  const systemPrompt = `Ты — дружелюбный ассистент-навигатор на образовательной выставке.

ВЫСТАВКА: ${expoInfo.place}
ДАТА: ${expoInfo.date}, ${expoInfo.time}

УЧАСТНИКИ ВЫСТАВКИ (рекомендуй ТОЛЬКО их):
${participantList}

Правила:
1. Отвечай кратко и по делу (2-4 предложения)
2. Если нужна свежая информация об университете — используй веб-поиск
3. Учитывай тип участника: Universities, Study Abroad Agencies, Private Schools, Language Tests, Internship Agency
4. В конце ВСЕГДА добавляй маркер: <<<STAND:{"index":N}>>> где N — номер участника из списка выше (1-${participants.length}), или 0 если не можешь определить

Стиль: тёплый, на «вы», без канцелярита.`;

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': API_KEY,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-5',
        max_tokens: 1000,
        system: systemPrompt,
        tools: [{ type: 'web_search_20250305', name: 'web_search' }],
        messages: conversation
      })
    });
    const data = await resp.json();
    let fullText = '';
    if (data.content) {
      for (const block of data.content) {
        if (block.type === 'text') fullText += block.text;
      }
    }
    removeLoadingMsg();
    const standMatch = fullText.match(/<<<STAND:\{"index":(\d+)\}>>>/);
    let standInfo = null;
    if (standMatch) {
      const idx = parseInt(standMatch[1]) - 1;
      if (idx >= 0 && idx < participants.length) standInfo = participants[idx];
    }
    const display = fullText.replace(/<<<STAND:.*?>>>/g, '').trim().replace(/\n/g, '<br>');
    addMessage('bot', display, standInfo);
    conversation.push({ role: 'assistant', content: fullText });
  } catch (err) {
    removeLoadingMsg();
    addMessage('bot', 'Не удалось получить ответ. Проверьте подключение к интернету.');
  }

  isBusy = false;
  document.getElementById('send-btn').disabled = false;
}

// Start
loadParticipants();
</script>
</body>
</html>

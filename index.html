  .stand-card { margin-top: 9px; padding: 10px 12px; border-radius: var(--radius-sm); border: 0.5px solid var(--green-100); background: var(--green-50); }

  .dot-anim span:nth-child(3) { animation-delay: 0.4s; }

  .input-area { flex-shrink: 0; padding: 10px 12px calc(10px + var(--safe-bottom)); border-top: 0.5px solid var(--border); background: var(--bg); display: flex; gap: 8px; align-items: flex-end; }

// Script-based language detection for non-Latin scripts
const scriptDetectors = [
  { lang: 'ru', re: /[а-яёА-ЯЁ]/, threshold: 3 },
  { lang: 'kk', re: /[әіңғүұқөһӘІҢҒҮҰҚӨҺ]/, threshold: 1 },
  { lang: 'ky', re: /[өүңӊ]/, threshold: 1 },
  { lang: 'ka', re: /[\u10D0-\u10FF]/, threshold: 1 },
  { lang: 'ar', re: /[\u0600-\u06FF]/, threshold: 2 },
  { lang: 'hi', re: /[\u0900-\u097F]/, threshold: 2 },
  { lang: 'vi', re: /[àáâãèéêìíòóôõùúýăđơư]/i, threshold: 2 },
];

function detectLangFromText(text) {
  for (const d of scriptDetectors) {
    if ((text.match(d.re) || []).length >= d.threshold) return d.lang;
  }
  return null; // Latin — keep current or use browser lang
}

function t() { return i18n[detectedLang] || i18n.en; }

function applyLanguage(lang) {
  if (!i18n[lang]) lang = 'en';
  detectedLang = lang;
  document.getElementById('header-sub').textContent = t().sub;
  
  const inp = document.getElementById('input');
  if (inp) inp.placeholder = t().ph;
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
  return lines.slice(1).map(line => {
    const vals = []; let cur = '', inQ = false;
    for (let ch of line) {
      if (ch === '"') inQ = !inQ;
      else if (ch === ',' && !inQ) { vals.push(cur.trim()); cur = ''; }
      else cur += ch;
    }
    vals.push(cur.trim());
    const obj = {};
    headers.forEach((h,i) => obj[h] = (vals[i]||'').replace(/^"|"$/g,''));
    return obj;
  });
}

async function loadParticipants() {
  try {
    const resp = await fetch(CSV_URL);
    const text = await resp.text();
    const rows = parseCSV(text);
    participants = rows.map(r => ({
      type: r['Type']||'', name: r['Name']||'', country: r['Country']||'',
      date: r['Date']||'', place: r['Place']||'', time: r['Time']||'', stand: r['Stand']||''
    })).filter(p => p.name);
    if (participants.length > 0) {
      expoInfo = { date: participants[0].date, place: participants[0].place.trim(), time: participants[0].time };
    }
    const initLang = i18n[browserLang] ? browserLang : 'en';
    applyLanguage(initLang);
    renderExpoBar();
    enableChat();
    showWelcome();
  } catch(e) {
    document.getElementById('expo-meta').textContent = t().err;
    
  }
}

);
}

function enableChat() {
  document.getElementById('input').disabled = false;
  document.getElementById('send-btn').disabled = false;
}

function showWelcome() {
  const uniCount = participants.filter(p => p.type === 'Universities').length;
  const l = t();
  const chipsHtml = l.chips.map((c,i) =>
    `<div class="chip" onclick="quickAsk('${l.queries[i].replace(/'/g,"\\'")}')">${c}</div>`
  ).join('');
  addMessage('bot', `${l.welcome(participants.length, uniCount)}<div class="chips">${chipsHtml}</div>`);
}

function addMessage(role, html, standInfo) {
  const msgs = document.getElementById('messages');
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;
  const av = document.createElement('div');
  av.className = `av ${role}`;
  av.innerHTML = role === 'bot' ? '🤖' : '👤';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = renderMarkdown(html);
  if (standInfo) {
    const card = document.createElement('div');
    card.className = 'stand-card';
    card.innerHTML = `<div class="stand-card-label">${t().standLbl}</div>
      <div class="stand-card-name">${standInfo.name}</div>
      <div class="stand-card-meta">${standInfo.country ? standInfo.country + ' · ' : ''}Stand ${standInfo.stand}</div>`;
    bubble.appendChild(card);
  }
  wrap.appendChild(av); wrap.appendChild(bubble);
  msgs.appendChild(wrap);
  msgs.scrollTop = msgs.scrollHeight;
}

function addLoadingMsg() {
  const msgs = document.getElementById('messages');
  const wrap = document.createElement('div');
  wrap.className = 'msg bot'; wrap.id = 'loading-msg';
  wrap.innerHTML = `<div class="av bot">🤖</div><div class="loading-bubble"><div class="dot-anim"><span></span><span></span><span></span></div><span>${t().searching}</span></div>`;
  msgs.appendChild(wrap);
  msgs.scrollTop = msgs.scrollHeight;
}
function removeLoadingMsg() { const el = document.getElementById('loading-msg'); if(el) el.remove(); }
function handleKey(e) { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();} }
function autoResize(el) { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,110)+'px'; }
function quickAsk(text) { document.getElementById('input').value=text; sendMessage(); }

const langNames = {
  en:'English',ru:'Russian',kk:'Kazakh',uz:'Uzbek',ky:'Kyrgyz',
  az:'Azerbaijani',ka:'Georgian',ro:'Romanian',id:'Indonesian',
  ar:'Arabic',vi:'Vietnamese',hi:'Hindi',de:'German',it:'Italian'
};

async function sendMessage() {
  if (isBusy || !participants.length) return;
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;

  // Auto-detect language from user input
  const detected = detectLangFromText(text);
  if (detected && detected !== detectedLang) applyLanguage(detected);

  input.value = ''; input.style.height = 'auto';
  addMessage('user', text);
  conversation.push({ role:'user', content:text });
  isBusy = true;
  document.getElementById('send-btn').disabled = true;
  addLoadingMsg();

  const participantList = participants.map((p,i) =>
    `${i+1}. [${p.type}] ${p.name}${p.country?' ('+p.country+')':''} — Stand ${p.stand}`
  ).join('\n');

  const replyLang = langNames[detectedLang] || 'English';

  const systemPrompt = `You are a friendly assistant-navigator at an international education fair.

FAIR: ${expoInfo.place}
DATE: ${expoInfo.date}, ${expoInfo.time}

PARTICIPANTS (recommend ONLY these):
${participantList}

Rules:
1. ALWAYS reply in ${replyLang}.
2. Give a short helpful answer (2-4 sentences).
3. Use web search if you need fresh info about a university.
4. Consider participant types: Universities, Study Abroad Agencies, Private Schools, Language Tests, Internship Agency.
5. Always end with: <<<STAND:{"index":N}>>> where N = participant number (1-${participants.length}), or 0 if unclear.

Tone: warm, friendly, no bureaucratic language.`;

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key': API_KEY,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body: JSON.stringify({
        model:'claude-sonnet-4-5',
        max_tokens:1000,
        system: systemPrompt,
        tools:[{type:'web_search_20250305',name:'web_search'}],
        messages: conversation
      })
    });
    const data = await resp.json();
    let fullText = '';
    if (data.content) for (const b of data.content) if (b.type==='text') fullText += b.text;
    removeLoadingMsg();
    const m = fullText.match(/<<<STAND:\{"index":(\d+)\}>>>/);
    let standInfo = null;
    if (m) { const idx=parseInt(m[1])-1; if(idx>=0&&idx<participants.length) standInfo=participants[idx]; }
    const display = fullText.replace(/<<<STAND:.*?>>>/g,'').trim().replace(/\n/g,'<br>');
    addMessage('bot', display, standInfo);
    conversation.push({ role:'assistant', content:fullText });
  } catch(err) {
    removeLoadingMsg();
    addMessage('bot', t().errReply);
  }
  isBusy = false;
  document.getElementById('send-btn').disabled = false;
}

function renderMarkdown(text) {
  return text
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>');
}

loadParticipants();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#273476">
<meta name="mobile-web-app-capable" content="yes">
<title>UniGuide — Education Fair Assistant</title>
<link rel="icon" href="https://www.begingroup.com/local/templates/begin_group/favicon.ico">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --brand: #273476; --brand-dark: #1a2454; --brand-light: #DCDEE4; --brand-mid: #b0b5d0;
    --bg: #FFFFFF; --bg2: #F5F5F3; --bg3: #EDEDE9;
    --text: #1A1A18; --text2: #6B6B67; --text3: #9E9E99;
    --border: rgba(0,0,0,0.10); --border2: rgba(0,0,0,0.18);
    --radius: 12px; --radius-sm: 8px; --radius-pill: 99px;
    --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151513; --bg2: #1E1E1B; --bg3: #252522;
      --text: #F0F0EC; --text2: #9E9E9A; --text3: #6B6B68;
      --border: rgba(255,255,255,0.09); --border2: rgba(255,255,255,0.15);
      --brand: #4a5fa8; --brand-dark: #6b7fc4; --brand-light: #1e2340; --brand-mid: #2a3060;
    }
  }
  html, body { height: 100%; width: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  .app { display: flex; flex-direction: column; height: 100dvh; max-width: 600px; margin: 0 auto; }

  /* Header */
  .header { flex-shrink: 0; padding: 12px 16px 10px; border-bottom: 0.5px solid var(--border); background: var(--bg); display: flex; align-items: center; gap: 10px; }
  .logo-img { height: 32px; width: auto; display: block; }
  .header-divider { width: 1px; height: 24px; background: var(--border2); }
  .header-text .title { font-size: 15px; font-weight: 600; color: var(--text); }
  .header-text .sub { font-size: 11px; color: var(--text3); margin-top: 1px; }

  /* Expo meta */
  .expo-bar { flex-shrink: 0; padding: 8px 16px; border-bottom: 0.5px solid var(--border); background: var(--bg2); font-size: 11px; color: var(--text2); }

  /* Messages */
  .messages { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 14px 8px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
  .msg { display: flex; gap: 7px; max-width: 92%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.bot { align-self: flex-start; }
  .av { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 13px; margin-top: 2px; }
  .av.bot { background: var(--brand-light); color: var(--brand); }
  .av.user { background: var(--bg3); color: var(--text2); }
  .bubble { padding: 9px 12px; font-size: 14px; line-height: 1.5; border-radius: var(--radius); }
  .msg.user .bubble { background: var(--brand-light); color: var(--brand); border-radius: var(--radius) 4px var(--radius) var(--radius); }
  .msg.bot .bubble { background: var(--bg2); color: var(--text); border-radius: 4px var(--radius) var(--radius) var(--radius); border: 0.5px solid var(--border); padding-bottom: 12px; }

  /* Stand card */
  .stand-card { margin-top: 9px; padding: 10px 12px; border-radius: var(--radius-sm); border: 0.5px solid var(--brand-mid); background: var(--brand-light); }
  .stand-card-label { font-size: 10px; color: var(--brand); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .stand-card-name { font-size: 13px; font-weight: 600; color: var(--brand); }
  .stand-card-meta { font-size: 11px; color: var(--brand-dark); margin-top: 2px; }

  /* Chips / option buttons */
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .chip { padding: 8px 15px; border-radius: var(--radius-pill); border: 1.5px solid var(--brand); background: transparent; font-size: 13px; color: var(--brand); cursor: pointer; font-family: var(--font); font-weight: 600; transition: background 0.15s, color 0.15s, transform 0.1s; line-height: 1.3; }
  .chip:hover { background: var(--brand); color: #fff; transform: translateY(-1px); }
  .chip:active { background: var(--brand-dark); color: #fff; transform: translateY(0); }
  .chip:disabled { opacity: 0.4; cursor: default; transform: none; }
  @media (prefers-color-scheme: dark) {
    .chip { border-color: #7b8fd4; color: #a0aee0; }
    .chip:hover { background: #4a5fa8; color: #fff; border-color: #4a5fa8; }
  }

  /* Loading */
  .loading-bubble { padding: 11px 14px; background: var(--bg2); border-radius: 4px var(--radius) var(--radius) var(--radius); border: 0.5px solid var(--border); display: flex; align-items: center; gap: 6px; }
  .loading-bubble span { font-size: 12px; color: var(--text3); }
  .dot-anim span { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--brand); animation: blink 1.2s infinite; }
  .dot-anim span:nth-child(2) { animation-delay: 0.2s; }
  .dot-anim span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100%{opacity:0.3;transform:scale(0.7)} 40%{opacity:1;transform:scale(1)} }

  /* Input */
  .input-area { flex-shrink: 0; padding: 10px 12px calc(10px + var(--safe-bottom)); border-top: 0.5px solid var(--border); background: var(--bg); display: flex; gap: 8px; align-items: flex-end; }
  .input-wrap { flex: 1; }
  textarea { width: 100%; resize: none; border: 0.5px solid var(--border2); border-radius: 20px; padding: 9px 14px; font-size: 15px; font-family: var(--font); background: var(--bg2); color: var(--text); outline: none; min-height: 38px; max-height: 110px; line-height: 1.4; display: block; -webkit-appearance: none; }
  textarea::placeholder { color: var(--text3); }
  textarea:focus { border-color: var(--brand); }
  .send-btn { height: 38px; padding: 0 14px; border-radius: var(--radius-pill); background: var(--brand); border: none; cursor: pointer; display: flex; align-items: center; gap: 5px; flex-shrink: 0; -webkit-tap-highlight-color: transparent; font-family: var(--font); font-size: 13px; font-weight: 500; color: #fff; white-space: nowrap; }
  .send-btn:active { background: var(--brand-dark); }
  .send-btn:disabled { opacity: 0.35; }
  .send-btn i { font-size: 15px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <img class="logo-img" src="https://www.begingroup.com/local/templates/begin_group/images/logo.png" alt="Begin Group">
    <div class="header-divider"></div>
    <div class="header-text">
      <div class="title">UniGuide</div>
      <div class="sub" id="header-sub">Education Fair Assistant</div>
    </div>
  </div>
  <div class="expo-bar" id="expo-meta">Loading fair data...</div>
  <div class="messages" id="messages"></div>
  <div class="input-area">
    <div class="input-wrap">
      <textarea id="input" rows="1" placeholder="Ask about programmes, admission, costs..." onkeydown="handleKey(event)" oninput="autoResize(this)" disabled></textarea>
    </div>
    <button class="send-btn" id="send-btn" onclick="sendMessage()" disabled>
      <span id="send-label">Send</span> →
    </button>
  </div>
</div>

const scriptDetectors=[
  {lang:'kk',re:/[әіңғүұқөһӘІҢҒҮҰҚӨҺ]/,th:1},
  {lang:'ky',re:/[өүңӊ]/,th:1},
  {lang:'ru',re:/[а-яёА-ЯЁ]/,th:3},
  {lang:'ka',re:/[\u10D0-\u10FF]/,th:1},
  {lang:'ar',re:/[\u0600-\u06FF]/,th:2},
  {lang:'hi',re:/[\u0900-\u097F]/,th:2},
  {lang:'vi',re:/[àáâãèéêìíòóôõùúýăđơư]/i,th:2},
];

function t(){return i18n[detectedLang]||i18n.en;}

function applyLanguage(lang){
  if(!i18n[lang])lang='en';
  detectedLang=lang;
  document.getElementById('header-sub').textContent=t().sub;
  const inp=document.getElementById('input');
  if(inp)inp.placeholder=t().ph;
  const lbl=document.getElementById('send-label');
  if(lbl)lbl.textContent=sendLabels[lang]||'Send';
}

function detectLangFromText(text){
  for(const d of scriptDetectors)
    if((text.match(d.re)||[]).length>=d.th)return d.lang;
  return null;
}

function parseCSV(text){
  const lines=text.trim().split('\n');
  const headers=lines[0].split(',').map(h=>h.trim().replace(/^"|"$/g,''));
  return lines.slice(1).map(line=>{
    const vals=[];let cur='',inQ=false;
    for(let ch of line){
      if(ch==='"')inQ=!inQ;
      else if(ch===','&&!inQ){vals.push(cur.trim());cur='';}
      else cur+=ch;
    }
    vals.push(cur.trim());
    const obj={};
    headers.forEach((h,i)=>obj[h]=(vals[i]||'').replace(/^"|"$/g,''));
    return obj;
  });
}

async function loadParticipants(){
  try{
    const resp=await fetch(CSV_URL);
    const text=await resp.text();
    const rows=parseCSV(text);
    participants=rows.map(r=>({
      type:r['Type']||'',name:r['Name']||'',country:r['Country']||'',
      date:r['Date']||'',place:r['Place']||'',time:r['Time']||'',stand:r['Stand']||''
    })).filter(p=>p.name);
    if(participants.length>0)
      expoInfo={date:participants[0].date,place:participants[0].place.trim(),time:participants[0].time};
    const initLang=i18n[browserLang]?browserLang:'en';
    applyLanguage(initLang);
    document.getElementById('expo-meta').textContent=
      `📅 ${expoInfo.date} · ⏰ ${expoInfo.time} · 📍 ${expoInfo.place}`;
    document.getElementById('input').disabled=false;
    document.getElementById('send-btn').disabled=false;
    showWelcome();
  }catch(e){
    document.getElementById('expo-meta').textContent=t().err;
  }
}

function renderMarkdown(text){
  return text
    .replace(/\n/g,'<br>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>');
}

function showWelcome(){
  const l = t();
  const firstOptions = l.firstOptions;
  const welcomeHtml = firstOptions
    ? l.welcome() + '\n<<<OPTIONS:' + JSON.stringify(firstOptions) + '>>>'
    : l.welcome();
  addMessage('bot', welcomeHtml);
}

function renderOptions(text) {
  const m = text.match(/<<<OPTIONS:(\[.*?\])>>>/s);
  if (!m) return {html: text, options: null};
  let options = null;
  try { options = JSON.parse(m[1]); } catch(e) {}
  const html = text.replace(/<<<OPTIONS:\[.*?\]>>>/s, '').trim();
  return {html, options};
}

function addMessage(role,html,standInfo){
  const msgs=document.getElementById('messages');
  const wrap=document.createElement('div');
  wrap.className=`msg ${role}`;
  const av=document.createElement('div');
  av.className=`av ${role}`;
  av.innerHTML=role==='bot'?'🤖':'👤';
  const bubble=document.createElement('div');
  bubble.className='bubble';

  if (role === 'bot') {
    const parsed = renderOptions(html);
    bubble.innerHTML = renderMarkdown(parsed.html);
    if (parsed.options && parsed.options.length) {
      const chips = document.createElement('div');
      chips.className = 'chips';
      parsed.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'chip';
        btn.textContent = opt;
        btn.onclick = () => {
          // Disable all chips in this message after selection
          chips.querySelectorAll('.chip').forEach(b => { b.disabled=true; b.style.opacity='0.5'; b.style.cursor='default'; });
          document.getElementById('input').value = opt;
          sendMessage();
        };
        chips.appendChild(btn);
      });
      bubble.appendChild(chips);
    }
  } else {
    bubble.innerHTML = renderMarkdown(html);
  }

  if(standInfo){
    const card=document.createElement('div');
    card.className='stand-card';
    card.innerHTML=`<div class="stand-card-label">${t().standLbl}</div>
      <div class="stand-card-name">${standInfo.name}</div>
      <div class="stand-card-meta">${standInfo.country?standInfo.country+' · ':''}Stand ${standInfo.stand}</div>`;
    bubble.appendChild(card);
  }
  wrap.appendChild(av);wrap.appendChild(bubble);
  msgs.appendChild(wrap);
  msgs.scrollTop=msgs.scrollHeight;
}

function addLoadingMsg(){
  const msgs=document.getElementById('messages');
  const wrap=document.createElement('div');
  wrap.className='msg bot';wrap.id='loading-msg';
  wrap.innerHTML=`<div class="av bot">🤖</div><div class="loading-bubble"><div class="dot-anim"><span></span><span></span><span></span></div><span>${t().searching}</span></div>`;
  msgs.appendChild(wrap);msgs.scrollTop=msgs.scrollHeight;
}
function removeLoadingMsg(){const el=document.getElementById('loading-msg');if(el)el.remove();}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,110)+'px';}


const langNames={en:'English',ru:'Russian',kk:'Kazakh',uz:'Uzbek',ky:'Kyrgyz',az:'Azerbaijani',ka:'Georgian',ro:'Romanian',id:'Indonesian',ar:'Arabic',vi:'Vietnamese',hi:'Hindi',de:'German',it:'Italian'};

async function sendMessage(){
  if(isBusy||!participants.length)return;
  const input=document.getElementById('input');
  const text=input.value.trim();
  if(!text)return;
  const detected=detectLangFromText(text);
  if(detected&&detected!==detectedLang)applyLanguage(detected);
  input.value='';input.style.height='auto';
  addMessage('user',text);
  conversation.push({role:'user',content:text});
  isBusy=true;document.getElementById('send-btn').disabled=true;
  addLoadingMsg();

  const participantList=participants.map((p,i)=>
    `${i+1}. [${p.type}] ${p.name}${p.country?' ('+p.country+')':''} — Stand ${p.stand}`
  ).join('\n');
  const replyLang=langNames[detectedLang]||'English';

  const systemPrompt=`You are a friendly consultant at an international education fair. Your goal is to understand each visitor's needs and recommend the most suitable participant(s) from the fair.

FAIR: ${expoInfo.place}
DATE: ${expoInfo.date}, ${expoInfo.time}

PARTICIPANTS (recommend ONLY from this list):
${participantList}

STRICT RULES:
- NEVER mention, recommend or refer to any other education fairs, exhibitions or events — not competitors, not other Begin Group events outside this fair.
- ONLY recommend participants from the list above. If a visitor asks about an institution not on the list, say it is not represented at this fair and suggest the closest alternative from the list.
- Do NOT recommend searching online for other fairs or events.

HOW TO BEHAVE:
- NEVER greet the visitor again — the greeting was already shown before the conversation started.
- Ask MAXIMUM 2 clarifying questions before making a recommendation. Often 1 question is enough.
- Do NOT ask about: language of instruction, nationality, age (unless relevant), GPA, test scores.
- Focus only on: type of institution (already known from first message), field of study, level (bachelor/master/other).
- When you need more info: ask ONE short question AND always add options: <<<OPTIONS:["Option A","Option B","Option C"]>>> on a separate line. NEVER ask without options.
- When you have enough info (usually after 1-2 answers): give a recommendation (2-4 sentences), use **bold** for institution names. No OPTIONS needed.
- Use web search only for specific up-to-date info about an institution.
- ALWAYS reply in ${replyLang}.
- End EVERY response with: <<<STAND:{"index":N}>>> (N = 1-${participants.length}, or 0 if still asking).

Example:
What field interests you?
<<<OPTIONS:["Business & Economics","IT & Engineering","Medicine & Sciences","Arts & Humanities","Undecided"]>>>
<<<STAND:{"index":0}>>>

Tone: warm, personal, like a knowledgeable friend.
IMPORTANT TERMINOLOGY: In Russian always say "выставка" (not "ярмарка"). In Kazakh: "көрме". In Uzbek: "ko'rgazma". In Kyrgyz: "көргөзмө". In Azerbaijani: "sərgi". In Georgian: "გამოფენა".`;

  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':API_KEY,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:1000,system:systemPrompt,tools:[{type:'web_search_20250305',name:'web_search'}],messages:conversation})
    });
    const data=await resp.json();
    let fullText='';
    if(data.content)for(const b of data.content)if(b.type==='text')fullText+=b.text;
    removeLoadingMsg();
    const m=fullText.match(/<<<STAND:\{"index":(\d+)\}>>>/);
    let standInfo=null;
    if(m){const idx=parseInt(m[1])-1;if(idx>=0&&idx<participants.length)standInfo=participants[idx];}
    const display=fullText.replace(/<<<STAND:.*?>>>/g,'').trim();
    addMessage('bot',display,standInfo);
    // Store clean version without markers in conversation history
    const cleanForHistory=fullText.replace(/<<<STAND:.*?>>>/g,'').replace(/<<<OPTIONS:.*?>>>/gs,'').trim();
    conversation[conversation.length-1]={role:'assistant',content:cleanForHistory};
    // history already updated above
  }catch(err){
    removeLoadingMsg();addMessage('bot',t().errReply);
  }
  isBusy=false;document.getElementById('send-btn').disabled=false;
}

loadParticipants();
